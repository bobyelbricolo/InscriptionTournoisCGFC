<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournois</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1>Tournois</h1>
    <p class="sous-titre">Choisis un tournoi</p>
  </div>

  <div class="section-titre">Qui es-tu ?</div>
  <div id="choix-moi" class="select-moi"></div>
  <p class="sous-titre" id="info-moi"></p>

  <div class="section-titre">À venir</div>
  <div id="liste-avenir"></div>

  <div class="section-titre" style="margin-top:32px">Passés</div>
  <div id="liste-passes"></div>
</div>

<script src="api.js"></script>
<script src="choix-nom.js"></script>
<script>
const BADGES = {
  Ouvert: { classe: 'ouvert', texte: 'Ouvert' },
  Bientot: { classe: 'bientot', texte: 'Inscription bientôt terminée' },
  Ferme: { classe: 'ferme', texte: 'Inscription terminée' }
};

const CLE_MOI = 'covoitMoi';
let MOI = '';
try { MOI = localStorage.getItem(CLE_MOI) || ''; } catch (e) { /* stockage indisponible */ }
let TOURNOIS = [];
let ROSTER = [];
let MES_INSCRIPTIONS = null; // null = inconnu, sinon { nomTournoi: inscription }

(async function () {
  try {
    const res = await Promise.all([
      apiGet('listTournois'),
      apiGet('getRoster').catch(function () { return []; })
    ]);
    TOURNOIS = res[0];
    ROSTER = res[1];
    remplirSelectMoi();
    await chargerMesInscriptions();
    afficherTournois();
  } catch (err) {
    document.getElementById('liste-avenir').innerHTML =
      '<p class="sous-titre" style="color:var(--danger)">Erreur : ' + err.message + '</p>';
  }
})();

function afficherTournois() {
  const aujourdhui = new Date();
  aujourdhui.setHours(0, 0, 0, 0);

  const avenir = TOURNOIS.filter(function (t) { return !estPasse(t.date, aujourdhui); });
  const passes = TOURNOIS.filter(function (t) { return estPasse(t.date, aujourdhui); });

  remplir('liste-avenir', avenir, 'Aucun tournoi à venir pour le moment.', false);
  remplir('liste-passes', passes, 'Aucun tournoi passé.', true);
}

// Champ "Qui es-tu ?" : le nom choisi est mémorisé sur l'appareil (repris sur les autres pages)
function remplirSelectMoi() {
  const connu = ROSTER.find(function (p) { return p.prenom + ' ' + p.nom === MOI; });
  if (!connu) MOI = '';

  const choix = creerChoixNom(document.getElementById('choix-moi'), ROSTER, {
    placeholder: 'Choisis ton nom',
    onChange: async function (p) {
      MOI = p ? p.prenom + ' ' + p.nom : '';
      try { localStorage.setItem(CLE_MOI, MOI); } catch (e) { /* stockage indisponible */ }
      await chargerMesInscriptions();
      afficherTournois();
    }
  });
  if (connu) choix.choisir(connu);
}

// Récupère, en un seul appel, toutes les inscriptions de la personne choisie
async function chargerMesInscriptions() {
  const info = document.getElementById('info-moi');
  info.textContent = '';
  MES_INSCRIPTIONS = null;

  const p = ROSTER.find(function (r) { return r.prenom + ' ' + r.nom === MOI; });
  if (!p) return;
  try {
    const liste = await apiGet('getMesInscriptions', { nom: p.nom, prenom: p.prenom });
    MES_INSCRIPTIONS = {};
    liste.forEach(function (r) { MES_INSCRIPTIONS[r.tournoi] = r; });
  } catch (err) {
    info.textContent = 'Impossible de charger tes inscriptions : ' + err.message;
  }
}

// Bandeau "ma situation" d'une carte : ma présence en toutes lettres, puis le résumé de mes choix
function construireBlocMoi(t) {
  if (!MOI || MES_INSCRIPTIONS === null) return null;
  const r = MES_INSCRIPTIONS[t.nomTournoi];

  const PRESENCE = {
    'Je joue': { texte: '✅ Je joue', classe: 'inscrit' },
    'Je supporte': { texte: '📣 Je supporte', classe: 'inscrit' },
    'Je ne viens pas': { texte: '❌ Je suis absent(e)', classe: 'absent' }
  };
  const LUNCH = { 'Oui végé': '🥗 Lunchpack végé', 'Oui non végé': '🥪 Lunchpack carné' };
  const REPAS = { 'Oui végé': '🥗 Repas du soir végé', 'Oui non végé': '🍽️ Repas du soir carné' };

  const bloc = document.createElement('div');
  bloc.className = 'carte-moi';

  const statut = document.createElement('span');
  if (!r) {
    statut.className = 'statut-carte non-inscrit';
    statut.textContent = 'Pas de réponse';
    bloc.appendChild(statut);
    return bloc;
  }

  const p = PRESENCE[r.presence] || { texte: r.presence || '', classe: 'inscrit' };
  statut.className = 'statut-carte ' + p.classe;
  statut.textContent = p.texte;
  bloc.appendChild(statut);

  const puces = [];
  if (LUNCH[r.lunchpack]) puces.push(LUNCH[r.lunchpack]);
  if (REPAS[r.repasSoir]) puces.push(REPAS[r.repasSoir]);
  if (r.logement) puces.push('🛏️ ' + String(r.logement).replace(/ soir/g, ''));
  if (r.covoitAller === true || r.covoitRetour === true) puces.push('🚗 Covoit');

  puces.forEach(function (texte) {
    const s = document.createElement('span');
    s.className = 'chip-moi';
    s.textContent = texte;
    bloc.appendChild(s);
  });
  return bloc;
}


function estPasse(dateStr, aujourdhui) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  return d < aujourdhui;
}

function formatDateFr(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const jj = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const aaaa = d.getFullYear();
  return jj + '/' + mm + '/' + aaaa;
}

// Titre d'une carte : "Ville - Équipe Homme", "Ville - Équipe Femme" ou "Ville - Équipe Homme / Femme"
// (gars A ou gars B => Homme ; fille => Femme)
function titreTournoi(t) {
  const eq = String(t.equipesEngagees || '');
  const homme = /gars/i.test(eq);
  const femme = /fille/i.test(eq);
  let equipe = '';
  if (homme && femme) equipe = 'Équipe Homme / Femme';
  else if (homme) equipe = 'Équipe Homme';
  else if (femme) equipe = 'Équipe Femme';
  return (t.ville || t.nomTournoi) + (equipe ? ' - ' + equipe : '');
}

function remplir(id, tournois, texteVide, passe) {
  const container = document.getElementById(id);
  container.innerHTML = '';
  if (tournois.length === 0) {
    container.innerHTML = '<p class="sous-titre">' + texteVide + '</p>';
    return;
  }
  tournois.forEach(function (t) {
    const a = document.createElement('a');
    a.className = 'carte-tournoi' + (passe ? ' passe' : '');
    a.href = 'tableau.html?tournoi=' + encodeURIComponent(t.nomTournoi);

    const header = document.createElement('div');
    header.className = 'carte-header';

    const blocTitre = document.createElement('div');
    const titre = document.createElement('div');
    titre.className = 'carte-titre';
    titre.textContent = titreTournoi(t);
    blocTitre.appendChild(titre);
    const nom = document.createElement('div');
    nom.className = 'carte-nom';
    nom.textContent = t.nomTournoi;
    blocTitre.appendChild(nom);
    header.appendChild(blocTitre);

    const badgeInfo = BADGES[t.statut] || BADGES.Ferme;
    const badge = document.createElement('span');
    badge.className = 'badge-statut ' + badgeInfo.classe;
    badge.textContent = badgeInfo.texte;
    header.appendChild(badge);

    a.appendChild(header);

    const date = document.createElement('div');
    date.className = 'carte-sous';
    date.textContent = formatDateFr(t.date);
    a.appendChild(date);

    const reponses = document.createElement('div');
    reponses.className = 'carte-sous';
    reponses.textContent = t.nbReponses + ' réponse(s)';
    a.appendChild(reponses);

    const blocMoi = construireBlocMoi(t);
    if (blocMoi) a.appendChild(blocMoi);

    container.appendChild(a);
  });
}
</script>
</body>
</html>
