<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournois</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1>Tournois</h1>
    <p class="sous-titre">Choisis un tournoi</p>
  </div>

  <div class="section-titre">À venir</div>
  <div id="liste-avenir"></div>

  <div class="section-titre" style="margin-top:32px">Passés</div>
  <div id="liste-passes"></div>
</div>

<script src="api.js"></script>
<script>
const BADGES = {
  Ouvert: { classe: 'ouvert', texte: 'Ouvert' },
  Bientot: { classe: 'bientot', texte: 'Inscription bientôt terminée' },
  Ferme: { classe: 'ferme', texte: 'Inscription terminée' }
};

(async function () {
  try {
    const tournois = await apiGet('listTournois');
    const aujourdhui = new Date();
    aujourdhui.setHours(0, 0, 0, 0);

    const avenir = tournois.filter(function (t) { return !estPasse(t.date, aujourdhui); });
    const passes = tournois.filter(function (t) { return estPasse(t.date, aujourdhui); });

    remplir('liste-avenir', avenir, 'Aucun tournoi à venir pour le moment.', false);
    remplir('liste-passes', passes, 'Aucun tournoi passé.', true);
  } catch (err) {
    document.getElementById('liste-avenir').innerHTML =
      '<p class="sous-titre" style="color:var(--danger)">Erreur : ' + err.message + '</p>';
  }
})();

function estPasse(dateStr, aujourdhui) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  return d < aujourdhui;
}

function formatDateFr(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const jj = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const aaaa = d.getFullYear();
  return jj + '/' + mm + '/' + aaaa;
}

function remplir(id, tournois, texteVide, passe) {
  const container = document.getElementById(id);
  container.innerHTML = '';
  if (tournois.length === 0) {
    container.innerHTML = '<p class="sous-titre">' + texteVide + '</p>';
    return;
  }
  tournois.forEach(function (t) {
    const a = document.createElement('a');
    a.className = 'carte-tournoi' + (passe ? ' passe' : '');
    a.href = 'tableau.html?tournoi=' + encodeURIComponent(t.nomTournoi);

    const header = document.createElement('div');
    header.className = 'carte-header';

    const titre = document.createElement('div');
    titre.className = 'carte-titre';
    titre.textContent = t.nomTournoi;
    header.appendChild(titre);

    const badgeInfo = BADGES[t.statut] || BADGES.Ferme;
    const badge = document.createElement('span');
    badge.className = 'badge-statut ' + badgeInfo.classe;
    badge.textContent = badgeInfo.texte;
    header.appendChild(badge);

    a.appendChild(header);

    const date = document.createElement('div');
    date.className = 'carte-sous';
    date.textContent = formatDateFr(t.date);
    a.appendChild(date);

    const lieu = document.createElement('div');
    lieu.className = 'carte-sous';
    lieu.textContent = t.ville;
    a.appendChild(lieu);

    const reponses = document.createElement('div');
    reponses.className = 'carte-sous';
    reponses.textContent = t.nbReponses + ' réponse(s)';
    a.appendChild(reponses);

    container.appendChild(a);
  });
}
</script>
</body>
</html>
