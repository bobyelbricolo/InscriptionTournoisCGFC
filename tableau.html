<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournoi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div id="nav-placeholder"></div>
  <div class="topbar">
    <h1 id="titre-tournoi"></h1>
    <p class="sous-titre">Qui est déjà inscrit</p>
  </div>

  <div class="section-titre">Qui es-tu ?</div>
  <select id="select-moi" class="select-moi"><option value="">Choisis ton nom</option></select>
  <div id="bloc-moi"></div>
  <div id="stats"></div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script>
const TOURNOI = new URLSearchParams(location.search).get('tournoi') || '';
document.getElementById('titre-tournoi').textContent = TOURNOI || 'Tournoi introuvable';

// Champs dont les pastilles ouvrent une liste séparée gars / filles.
// Pour en ajouter un autre plus tard, ajoutez simplement son id ici.
const CHAMPS_EN_LISTE = ['lunchpack', 'repasSoir', 'logement'];
const EQUIPES_ORDRE = ['Équipe gars', 'Équipe fille'];
const CRENEAUX = ['Matin', 'Après-midi', 'Soir'];
const ICONE_VOITURE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-6h14l2 6v4h-2a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H3z"/><path d="M3 13h18"/></svg>';

(async function () {
  try {
    const res = await Promise.all([
      apiGet('getStatsTournoi', { nom: TOURNOI }),
      apiGet('getRoster'),
      apiGet('getTournoi', { nom: TOURNOI })
    ]);
    ROSTER = res[1];
    STATUT = res[2] ? res[2].statut : 'Ferme';
    remplirSelectMoi();
    await chargerMonInscription();
    afficher(res[0]);
    afficherBlocMoi();
  } catch (err) {
    document.getElementById('stats').innerHTML =
      '<p class="sous-titre" style="color:var(--danger)">Erreur : ' + err.message + '</p>';
  }
})();

// Liste déroulante "Qui es-tu ?" : tout l'effectif, le nom choisi est mémorisé sur l'appareil
function remplirSelectMoi() {
  const select = document.getElementById('select-moi');
  ROSTER.forEach(function (p) {
    const o = document.createElement('option');
    o.value = p.prenom + ' ' + p.nom;
    o.textContent = o.value;
    select.appendChild(o);
  });
  const connu = ROSTER.some(function (p) { return p.prenom + ' ' + p.nom === MOI; });
  if (!connu) MOI = '';
  select.value = MOI;

  select.onchange = async function () {
    MOI = select.value;
    try { localStorage.setItem(CLE_MOI, MOI); } catch (e) { /* stockage indisponible */ }
    MSG_COVOIT = null;
    await chargerMonInscription();
    afficher(STATS_COVOIT);
    afficherBlocMoi();
  };
}

// Récupère l'inscription de la personne choisie (null si elle n'est pas inscrite)
async function chargerMonInscription() {
  MON_INSCRIPTION = null;
  const p = ROSTER.find(function (r) { return r.prenom + ' ' + r.nom === MOI; });
  if (!p) return;
  try {
    MON_INSCRIPTION = await apiGet('getInscription', { tournoi: TOURNOI, nom: p.nom, prenom: p.prenom });
  } catch (err) { /* non bloquant */ }
}

// Adresse de la page d'inscription, ouverte sur la personne et, si besoin, sur un champ
function lienInscription(champ) {
  let url = 'inscription.html?tournoi=' + encodeURIComponent(TOURNOI) + '&moi=' + encodeURIComponent(MOI);
  if (champ) url += '&champ=' + encodeURIComponent(champ);
  return url;
}

function boutonLien(texte, champ, secondaire) {
  const a = document.createElement('a');
  a.className = 'principal' + (secondaire ? ' secondaire' : '') + (STATUT === 'Ferme' ? ' inactif' : '');
  a.textContent = texte;
  if (STATUT !== 'Ferme') a.href = lienInscription(champ);
  return a;
}

// Petit bouton "Modifier" placé à côté d'un champ
function boutonModifier(champ, texte) {
  const a = document.createElement('a');
  a.className = 'btn-mini';
  a.textContent = texte || '✎ Modifier';
  a.href = lienInscription(champ);
  return a;
}

function afficherBlocMoi() {
  const bloc = document.getElementById('bloc-moi');
  bloc.innerHTML = '';

  if (!MOI) {
    const p = document.createElement('p');
    p.className = 'sous-titre';
    p.textContent = 'Choisis ton nom pour t\'inscrire ou modifier ton inscription.';
    bloc.appendChild(p);
    return;
  }

  const ferme = STATUT === 'Ferme';
  const statut = document.createElement('p');
  statut.className = 'statut-moi ' + (MON_INSCRIPTION ? 'inscrit' : 'non-inscrit');
  statut.textContent = MON_INSCRIPTION
    ? 'Tu es inscrit(e) à ce tournoi. Tes réponses sont en vert ci-dessous.' + (ferme ? ' Les modifications sont closes.' : '')
    : 'Tu n\'es pas encore inscrit(e) à ce tournoi.';
  bloc.appendChild(statut);

  const boutons = document.createElement('div');
  boutons.className = 'boutons-moi';
  if (!MON_INSCRIPTION) {
    boutons.appendChild(boutonLien(ferme ? 'Inscriptions closes' : 'M\'inscrire au tournoi', '', false));
  } else {
    boutons.appendChild(boutonLien('Modifier mon inscription', '', false));
    boutons.appendChild(boutonLien('M\'inscrire au covoit', 'covoitAller', true));
  }
  bloc.appendChild(boutons);
}

// La personne a-t-elle choisi cette option pour ce champ ?
function maReponse(id, opt) {
  if (!MON_INSCRIPTION) return false;
  const v = MON_INSCRIPTION[id];
  if (v === true) return opt === 'Oui';
  if (v === false || v === undefined || v === null) return false;
  return String(v).split(',').map(function (s) { return s.trim(); }).indexOf(opt) !== -1;
}

// Résumé de mes réponses de covoiturage (liste vide si je n'y suis pas inscrit)
function resumeMonCovoit() {
  const i = MON_INSCRIPTION;
  const lignes = [];
  if (!i) return lignes;
  if (i.covoitAller === true) lignes.push('Aller : ' + (i.creneauxAller || 'créneau non précisé'));
  if (i.covoitRetour === true) lignes.push('Retour : ' + (i.creneauxRetour || 'créneau non précisé'));
  if (lignes.length && i.proposeVoiture === 'Oui') lignes.push('Voiture : ' + (i.placesDispo || '?') + ' place(s)');
  return lignes;
}

function afficher(stats) {
  const statsDiv = document.getElementById('stats');
  statsDiv.innerHTML = '';
  const modifiable = !!MON_INSCRIPTION && STATUT !== 'Ferme';

  const total = document.createElement('p');
  total.className = 'sous-titre';
  total.textContent = stats.total + ' inscrit(s) pour le moment';
  statsDiv.appendChild(total);

  Object.keys(stats.parChamp).forEach(function (id) {
    const champ = stats.parChamp[id];

    const ligneTitre = document.createElement('div');
    ligneTitre.className = 'titre-ligne';
    const titre = document.createElement('div');
    titre.className = 'section-titre';
    titre.textContent = champ.label;
    ligneTitre.appendChild(titre);
    if (modifiable) ligneTitre.appendChild(boutonModifier(id));
    statsDiv.appendChild(ligneTitre);

    const pills = document.createElement('div');
    pills.className = 'pills';
    const panneauxDiv = document.createElement('div');
    const ouvrables = [];

    Object.keys(champ.counts).forEach(function (opt) {
      const span = document.createElement('span');
      span.className = 'pill-info' + (maReponse(id, opt) ? ' moi' : '');
      span.textContent = opt + ' : ' + champ.counts[opt];

      let panneau = null;
      if (id === 'equipe' && stats.equipes && stats.equipes[opt]) {
        panneau = construirePanneau(opt, stats.equipes[opt]);
      } else if (CHAMPS_EN_LISTE.indexOf(id) !== -1) {
        panneau = construirePanneauParEquipe((champ.membres && champ.membres[opt]) || []);
      }

      if (panneau) {
        relierPastille(span, panneau, ouvrables);
        panneauxDiv.appendChild(panneau);
      }
      pills.appendChild(span);
    });

    statsDiv.appendChild(pills);
    statsDiv.appendChild(panneauxDiv);
  });

  // La partie covoiturage est dessinée dans son propre bloc, pour pouvoir
  // la rafraîchir seule après une réservation
  const covoitDiv = document.createElement('div');
  covoitDiv.id = 'covoit';
  statsDiv.appendChild(covoitDiv);
  afficherCovoiturage(stats, covoitDiv);
}

// Liste des joueurs d'une équipe, triée : je joue / je supporte / je ne viens pas
function construirePanneau(equipe, joueurs) {
  const panneau = document.createElement('div');
  panneau.className = 'liste-equipe';

  const colonnes = document.createElement('div');
  colonnes.className = 'colonnes';

  ['Je joue', 'Je supporte', 'Je ne viens pas'].forEach(function (g) {
    const membres = joueurs
      .filter(function (j) { return j.presence === g; })
      .sort(function (a, b) { return a.nom.localeCompare(b.nom); });
    if (membres.length === 0) return;

    const titre = document.createElement('div');
    titre.className = 'groupe-titre';
    titre.textContent = g + ' (' + membres.length + ')';
    colonnes.appendChild(titre);

    membres.forEach(function (j) {
      const d = document.createElement('div');
      d.className = 'joueur';
      d.textContent = j.nom;
      colonnes.appendChild(d);
    });
  });

  panneau.appendChild(colonnes);
  return panneau;
}

// Liste des joueurs d'une option, séparée gars / filles avec sous-totaux et total
function construirePanneauParEquipe(membres) {
  const panneau = document.createElement('div');
  panneau.className = 'liste-equipe';

  if (membres.length === 0) {
    panneau.textContent = 'Personne pour le moment.';
    return panneau;
  }

  const groupes = EQUIPES_ORDRE.slice();
  membres.forEach(function (m) {
    if (groupes.indexOf(m.equipe) === -1) groupes.push(m.equipe);
  });

  groupes.forEach(function (eq) {
    const gens = membres
      .filter(function (m) { return m.equipe === eq; })
      .sort(function (a, b) { return a.nom.localeCompare(b.nom); });

    const entete = document.createElement('div');
    entete.className = 'entete-groupe';
    const nomEq = document.createElement('span');
    nomEq.textContent = eq || 'Équipe non renseignée';
    const sousTotal = document.createElement('span');
    sousTotal.className = 'sous-total';
    sousTotal.textContent = 'Sous-total : ' + gens.length;
    entete.appendChild(nomEq);
    entete.appendChild(sousTotal);
    panneau.appendChild(entete);

    const colonnes = document.createElement('div');
    colonnes.className = 'colonnes';
    gens.forEach(function (m) {
      const d = document.createElement('div');
      d.className = 'joueur';
      d.textContent = m.nom;
      colonnes.appendChild(d);
    });
    panneau.appendChild(colonnes);
  });

  const totalLigne = document.createElement('div');
  totalLigne.className = 'total-ligne';
  totalLigne.textContent = 'Total : ' + membres.length;
  panneau.appendChild(totalLigne);

  return panneau;
}

// Relie une pastille à son panneau : un clic ouvre le panneau et ferme les autres du même champ
function relierPastille(span, panneau, ouvrables) {
  span.classList.add('cliquable');
  ouvrables.push({ span: span, panneau: panneau });
  span.onclick = function () {
    const ouvrir = !panneau.classList.contains('ouvert');
    ouvrables.forEach(function (p) {
      p.panneau.classList.remove('ouvert');
      p.span.classList.remove('ouvert');
    });
    if (ouvrir) {
      panneau.classList.add('ouvert');
      span.classList.add('ouvert');
    }
  };
}

// Catégorie "Covoiturage" : mes réponses, puis pastilles Aller / Retour
function afficherCovoiturage(stats, conteneur) {
  STATS_COVOIT = stats;

  const resume = resumeMonCovoit();
  const modifiable = !!MON_INSCRIPTION && STATUT !== 'Ferme';

  const ligneTitre = document.createElement('div');
  ligneTitre.className = 'titre-ligne';
  const titre = document.createElement('div');
  titre.className = 'section-titre';
  titre.textContent = 'Covoiturage';
  ligneTitre.appendChild(titre);
  if (modifiable) {
    ligneTitre.appendChild(resume.length
      ? boutonModifier('covoitAller')
      : boutonModifier('covoitAller', 'M\'inscrire au covoit'));
  }
  conteneur.appendChild(ligneTitre);

  if (resume.length) {
    const box = document.createElement('div');
    box.className = 'resume-covoit';
    box.textContent = resume.join(' · ');
    conteneur.appendChild(box);
  }

  // Passagers possibles : inscrits au covoiturage sans proposer de voiture
  const vus = {};
  (stats.covoitAller || []).concat(stats.covoitRetour || []).forEach(function (p) {
    if (!p.propose) vus[p.nom] = true;
  });
  const noms = Object.keys(vus);
  const moi = noms.indexOf(MOI) !== -1 ? MOI : '';
  const reservable = !!stats.reservationsOuvertes && noms.length > 0;

  if (reservable && !MOI) {
    const aide = document.createElement('p');
    aide.className = 'sous-titre';
    aide.textContent = 'Tu cherches une place ? Choisis ton nom en haut de la page pour réserver.';
    conteneur.appendChild(aide);
  }

  if (MSG_COVOIT) {
    const m = document.createElement('div');
    m.className = 'msg-covoit ' + (MSG_COVOIT.ok ? 'ok' : 'err');
    m.textContent = MSG_COVOIT.texte;
    conteneur.appendChild(m);
  }

  const pills = document.createElement('div');
  pills.className = 'pills';
  const panneauxDiv = document.createElement('div');
  const ouvrables = [];

  [['Aller', stats.covoitAller || []], ['Retour', stats.covoitRetour || []]].forEach(function (trajet) {
    const span = document.createElement('span');
    span.className = 'pill-info';
    span.textContent = trajet[0] + ' : ' + trajet[1].length;

    const panneau = construirePanneauCovoit(trajet[0], trajet[1], moi, reservable);
    relierPastille(span, panneau, ouvrables, function (ouvert) {
      TRAJET_OUVERT = ouvert ? trajet[0] : null;
    });
    // Après un rafraîchissement, on rouvre le trajet qui était ouvert
    if (TRAJET_OUVERT === trajet[0]) {
      span.classList.add('ouvert');
      panneau.classList.add('ouvert');
    }
    pills.appendChild(span);
    panneauxDiv.appendChild(panneau);
  });

  conteneur.appendChild(pills);
  conteneur.appendChild(panneauxDiv);
}
// Liste d'un trajet, classée par créneau : matin / après-midi / soir
function construirePanneauCovoit(liste) {
  const panneau = document.createElement('div');
  panneau.className = 'liste-equipe';

  if (liste.length === 0) {
    panneau.textContent = 'Personne pour le moment.';
    return panneau;
  }

  const SANS_CRENEAU = 'Créneau non précisé';
  CRENEAUX.concat([SANS_CRENEAU]).forEach(function (creneau) {
    const gens = liste
      .filter(function (p) {
        const cren = (p.creneaux || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        return creneau === SANS_CRENEAU ? cren.length === 0 : cren.indexOf(creneau) !== -1;
      })
      .sort(function (a, b) {
        if (a.propose !== b.propose) return a.propose ? -1 : 1; // conducteurs d'abord
        return a.nom.localeCompare(b.nom);
      });

    if (creneau === SANS_CRENEAU && gens.length === 0) return;

    const entete = document.createElement('div');
    entete.className = 'entete-groupe';
    const nomCreneau = document.createElement('span');
    nomCreneau.textContent = creneau;
    const compte = document.createElement('span');
    compte.className = 'sous-total';
    compte.textContent = gens.length;
    entete.appendChild(nomCreneau);
    entete.appendChild(compte);
    panneau.appendChild(entete);

    gens.forEach(function (p) {
      const ligne = document.createElement('div');
      // "reserve" : la personne est déjà dans une voiture, on la grise (renseigné plus tard par l'API)
      ligne.className = 'ligne-covoit-liste' + (p.reserve ? ' reserve' : '');
      const nom = document.createElement('span');
      nom.textContent = p.nom;
      ligne.appendChild(nom);
      if (p.propose) ligne.appendChild(construireBadgeConducteur(p));
      panneau.appendChild(ligne);
    });
  });

  const note = document.createElement('div');
  note.className = 'note-liste';
  note.textContent = 'Une personne disponible sur plusieurs créneaux apparaît dans chacun.';
  panneau.appendChild(note);

  return panneau;
}

// Icône voiture + places restantes sur le total (ex. 2/4)
function construireBadgeConducteur(p) {
  const total = parseInt(p.places, 10) || 0;
  const restantes = Math.max(total - (p.nbPassagers || 0), 0);
  const badge = document.createElement('span');
  badge.className = 'badge-conducteur' + (total > 0 && restantes === 0 ? ' complet' : '');
  badge.title = total > 0 ? restantes + ' place(s) restante(s) sur ' + total : 'Conducteur';
  badge.innerHTML = ICONE_VOITURE + (total > 0 ? '<span>' + restantes + '/' + total + '</span>' : '');
  return badge;
}
</script>
</body>
</html>
